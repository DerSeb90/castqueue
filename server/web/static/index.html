<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CastQueue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f59e0b'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo"></span>CastQueue</div>
    <nav class="nav">
      <a href="#/queue" data-route="queue"><span class="ico">≡</span>Warteschlange <span class="badge" id="queue-count"></span></a>
      <a href="#/inbox" data-route="inbox"><span class="ico">✦</span>Neu</a>
      <a href="#/podcasts" data-route="podcasts"><span class="ico">▦</span>Abos</a>
      <a href="#/add" data-route="add"><span class="ico">+</span>Hinzufügen</a>
      <a href="#/settings" data-route="settings"><span class="ico">⚙</span>Einstellungen</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost small" id="btn-refresh" title="Alle Feeds aktualisieren">⟳ Aktualisieren</button>
      <button class="btn ghost small" id="btn-logout">Abmelden</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <div class="player hidden" id="player">
    <img class="player-art" id="player-art" alt="">
    <div class="player-info">
      <div class="player-title" id="player-title"></div>
      <div class="player-sub" id="player-sub"></div>
      <div class="player-bar">
        <span class="time" id="player-pos">0:00</span>
        <input type="range" id="player-seek" min="0" max="1000" value="0">
        <span class="time" id="player-dur">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="btn icon" id="btn-back" title="10 s zurück">↺</button>
      <button class="btn icon primary big" id="btn-play" title="Abspielen / Pause">▶</button>
      <button class="btn icon" id="btn-fwd" title="30 s vor">↻</button>
      <button class="btn icon" id="btn-next" title="Nächste in Warteschlange">⏭</button>
      <select id="player-speed" title="Geschwindigkeit">
        <option value="0.8">0,8×</option><option value="1" selected>1×</option><option value="1.2">1,2×</option>
        <option value="1.5">1,5×</option><option value="1.8">1,8×</option><option value="2">2×</option>
      </select>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>
  <div class="toast hidden" id="toast"></div>
</div>
<div id="login" class="login hidden">
  <form class="login-card" id="login-form">
    <div class="brand big"><span class="logo"></span>CastQueue</div>
    <label>Benutzername<input name="username" autocomplete="username" required></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Anmelden</button>
    <div class="error" id="login-error"></div>
  </form>
</div>
<script src="/app.js"></script>
</body>
</html>
