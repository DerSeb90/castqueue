<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CastQueue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f59e0b'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo"></span>CastQueue</div>
    <nav class="nav">
      <a href="#/queue" data-route="queue"><span class="ico">≡</span>Warteschlange <span class="badge" id="queue-count"></span></a>
      <a href="#/inbox" data-route="inbox"><span class="ico">✦</span>Neu</a>
      <a href="#/podcasts" data-route="podcasts"><span class="ico">▦</span>Abos</a>
      <a href="#/add" data-route="add"><span class="ico">+</span>Hinzufügen</a>
      <a href="#/settings" data-route="settings"><span class="ico">⚙</span>Einstellungen</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost small" id="btn-refresh" title="Alle Feeds aktualisieren">⟳ Aktualisieren</button>
      <button class="btn ghost small" id="btn-logout">Abmelden</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <div class="toast hidden" id="toast"></div>
</div>
<div id="login" class="login hidden">
  <form class="login-card" id="login-form">
    <div class="brand big"><span class="logo"></span>CastQueue</div>
    <label>Benutzername<input name="username" autocomplete="username" required></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Anmelden</button>
    <div class="error" id="login-error"></div>
  </form>
</div>
<script src="/app.js"></script>
</body>
</html>
