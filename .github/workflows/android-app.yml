name: android app

# Builds the signed Android APKs. Every push to main touching the app uploads
# them as a build artifact; a version tag (v*) additionally publishes them as
# a GitHub release, which is what the app's in-app update check reads.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-app.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Configure release signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/castqueue-release.jks

      - name: Build APK
        working-directory: app
        # Split per ABI so the download stays small. On a tag the version name
        # comes from the tag; the run number is the Android versionCode so every
        # build installs over the previous one.
        env:
          CASTQUEUE_STORE_FILE: ../castqueue-release.jks
          CASTQUEUE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CASTQUEUE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASTQUEUE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CASTQUEUE_REQUIRE_SIGNING: "1"
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--release --split-per-abi --build-number="$GITHUB_RUN_NUMBER")
          if [ "$REF_TYPE" = "tag" ]; then
            args+=(--build-name="${TAG#v}")
          fi
          flutter build apk "${args[@]}"

      - name: Verify release signature
        working-directory: app
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$tools/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castqueue-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # GitHub computes the SHA-256 digest of each asset; the app verifies
        # the download against it before installing.
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CastQueue $TAG" \
            --generate-notes \
            app/build/app/outputs/flutter-apk/*.apk

      - name: Explain how to install it
        run: |
          {
            echo "### CastQueue app"
            echo
            echo "Download the **castqueue-apk** artifact from this run and install"
            echo "\`app-arm64-v8a-release.apk\` on the phone."
            echo
            echo "The APK is signed with CastQueue's persistent release key; later"
            echo "releases install over it without losing app data."
          } >> "$GITHUB_STEP_SUMMARY"
